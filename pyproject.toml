# MARK: - Project
[project]
name = "python-uv-project-template"
version = "0.1.0"
authors = [{name = "Takahiro Ono"}]
maintainers = []
description = "Add your description here"
readme = "README.md"
license-files = ["LICEN[CS]E"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11, <3.14"
dependencies = []

[tool.uv]
required-version = ">=0.11.7,<0.12.0"

[tool.uv.dependency-groups]
dev = {requires-python = ">=3.13"}

[dependency-groups]
dev = [
    "flake8-class-attributes-order>=0.3.0",
    "pre-commit>=4.5.1",
    "pylint>=4.0.5",
    "pyproject-flake8>=7.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

# [project.urls]
# Documentation = "https://github.com"
# Issues = "https://github.com"
# Source = "https://github.com"

# [project.entry-points."SAMPLE_ENTRY_POINT_GROUP"]
# Add your entry points here.

[project.scripts]
# Add your scripts here.

[project.gui-scripts]
# Add your gui scripts here. (Windows only)

[tool.uv.workspace]
members = ["scripts/*", "tools/*"]

[tool.uv.sources]

# MARK: - Build
[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["python_package"]
# source-include = ["src/python_package/**"]

[tool.uv.build-backend.data]
headers = "include/headers"
scripts = "bin"
data = "share"

# MARK: - Tool Settings
[tool.pylint]
# lint only unsupported features on py311
disable = ["all"]
enable = ["E", "F"]
py-version = "3.11"
prefer-stubs = true
ignored-modules = []
ignore-paths = ["scripts", "typings"]
extension-pkg-whitelist = []

[tool.ty.environment]
python-version = "3.11"

[tool.ruff]
extend-exclude = []
target-version = "py311"

[tool.ruff.lint]
fixable = ["ALL"]
extend-select = ["D", "UP"]
ignore = [
    "D1",
    "D415",
]
unfixable = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.flake8]
# https://github.com/best-doctor/flake8-class-attributes-order
select = "CCE"
class_attributes_order = [
    "constant",
    "field",
    "outer_field",
    "protected field",
    "private field",
    "property_method",
    "protected_property_method",
    "private_property_method",
    "__new__",
    "__init__",
    "__post_init__",
    "magic_method",
    "static_method",
    "class_method",
    "method",
    "protected_static_method",
    "protected_class_method",
    "protected_method",
    "private_static_method",
    "private_class_method",
    "private_method",
    "nested_class",
]
